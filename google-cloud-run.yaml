# ============================================================================
# KATARAKT - Google Cloud Run Service Definition
# Deploy with: gcloud run services replace google-cloud-run.yaml
# ============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: katarakt-backend
  labels:
    app: katarakt
    component: backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Katarakt Browser Security Backend"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: katarakt-backend
          image: gcr.io/PROJECT_ID/katarakt-backend:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: KATARAKT_VERSION
              value: "1.0.0"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 240
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
