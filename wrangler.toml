# Security headers inspired by TOR and Mullvad.

name = "katarakt-security"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account configuration (set via environment or wrangler config)
# account_id = "YOUR_ACCOUNT_ID"

# Workers routes
# routes = [
#   { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Custom domain (optional)
# workers_dev = false
# route = "security.yourdomain.com/*"

[vars]
ENVIRONMENT = "production"
KATARAKT_VERSION = "1.0.0"
# "on" blocks requests whose User-Agent/headers look automated (curl, wget, headless browsers, ...)
BOT_BLOCKING = "off"

# KV Namespace for threat intelligence (optional)
# [[kv_namespaces]]
# binding = "THREAT_DB"
# id = "YOUR_KV_NAMESPACE_ID"

# Durable Objects for session tracking (optional)
# [[durable_objects.bindings]]
# name = "SESSION_TRACKER"
# class_name = "SessionTracker"

# R2 bucket for logs (optional)
# [[r2_buckets]]
# binding = "SECURITY_LOGS"
# bucket_name = "katarakt-logs"

# Analytics Engine (optional)
# [[analytics_engine_datasets]]
# binding = "SECURITY_ANALYTICS"

# Cron triggers: none. The Worker has no scheduled() handler, so a cron here would only produce
# failing invocations. Add a handler together with a cron expression if scheduled work is needed.
[triggers]
crons = []

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Build configuration
[build]
command = ""
watch_dir = "./"

# Environment-specific settings
[env.staging]
name = "katarakt-security-staging"
vars = { ENVIRONMENT = "staging" }

[env.production]
name = "katarakt-security"
vars = { ENVIRONMENT = "production" }

# Placement hints for optimal performance
# [placement]
# mode = "smart"

# Tail workers for logging (optional)
# [[tail_consumers]]
# service = "katarakt-logger"
