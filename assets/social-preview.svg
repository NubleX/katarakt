<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 212, 255, 0.1)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Large Shield Icon (Left) -->
  <g transform="translate(200, 180)" filter="url(#glowEffect)">
    <path d="M 0 0 L -80 35 L -80 130 C -80 165 -50 185 0 200 C 50 185 80 165 80 130 L 80 35 Z"
          fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -40 90 L -15 115 L 40 55"
          fill="none" stroke="#00ff88" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Title -->
  <g transform="translate(350, 230)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="96"
          font-weight="bold" fill="url(#accentGrad)" filter="url(#glowEffect)">
      KATARAKT
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(350, 310)">
    <text x="0" y="0" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="32"
          fill="#8e8e93" letter-spacing="3">
      BROWSER SECURITY SENTINEL
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(350, 380)" font-family="'JetBrains Mono', monospace" font-size="16">
    <!-- Cloudflare -->
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#ff9500" opacity="0.2"/>
    <rect x="0" y="0" width="160" height="40" rx="20" fill="none" stroke="#ff9500" stroke-width="2"/>
    <text x="80" y="26" fill="#ff9500" text-anchor="middle" font-weight="600">CLOUDFLARE</text>

    <!-- Google Cloud -->
    <rect x="180" y="0" width="180" height="40" rx="20" fill="#00d4ff" opacity="0.2"/>
    <rect x="180" y="0" width="180" height="40" rx="20" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <text x="270" y="26" fill="#00d4ff" text-anchor="middle" font-weight="600">GOOGLE CLOUD</text>

    <!-- Service Worker -->
    <rect x="380" y="0" width="200" height="40" rx="20" fill="#00ff88" opacity="0.2"/>
    <rect x="380" y="0" width="200" height="40" rx="20" fill="none" stroke="#00ff88" stroke-width="2"/>
    <text x="480" y="26" fill="#00ff88" text-anchor="middle" font-weight="600">SERVICE WORKER</text>
  </g>

  <!-- Feature List -->
  <g transform="translate(350, 460)" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#48484a">
    <text x="0" y="0">✓ Anti-Fingerprinting</text>
    <text x="250" y="0">✓ Tracker Blocking</text>
    <text x="500" y="0">✓ Bot Detection</text>
  </g>

  <!-- Bottom decorative elements -->
  <g opacity="0.6">
    <circle cx="950" cy="150" r="4" fill="#00d4ff"/>
    <circle cx="1020" cy="180" r="3" fill="#00ff88"/>
    <circle cx="1080" cy="140" r="4" fill="#bf5af2"/>
    <circle cx="1140" cy="170" r="3" fill="#00d4ff"/>

    <circle cx="920" cy="480" r="3" fill="#00ff88"/>
    <circle cx="990" cy="510" r="4" fill="#00d4ff"/>
    <circle cx="1060" cy="490" r="3" fill="#bf5af2"/>
    <circle cx="1120" cy="520" r="4" fill="#00ff88"/>
  </g>

  <!-- Accent line -->
  <line x1="350" y1="500" x2="850" y2="500" stroke="url(#accentGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Footer text -->
  <text x="350" y="550" font-family="'JetBrains Mono', monospace" font-size="14" fill="#48484a" letter-spacing="1">
    Multi-layered browser hardening with edge protection
  </text>
</svg>
