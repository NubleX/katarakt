<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 212, 255, 0.1)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- Main Shield -->
  <g transform="translate(256, 100)" filter="url(#glow)">
    <!-- Shield outline -->
    <path d="M 0 0 L -120 50 L -120 180 C -120 230 -80 260 0 280 C 80 260 120 230 120 180 L 120 50 Z"
          fill="none" stroke="url(#shieldGradient)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Checkmark -->
    <path d="M -60 130 L -20 170 L 60 80"
          fill="none" stroke="#00ff88" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Letter K -->
  <g transform="translate(256, 430)" filter="url(#glow)">
    <text x="0" y="0"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="72"
          font-weight="bold"
          fill="url(#shieldGradient)"
          text-anchor="middle">
      K
    </text>
  </g>

  <!-- Corner accents -->
  <circle cx="80" cy="80" r="6" fill="#00d4ff" opacity="0.6"/>
  <circle cx="432" cy="80" r="6" fill="#00ff88" opacity="0.6"/>
  <circle cx="80" cy="432" r="6" fill="#00ff88" opacity="0.6"/>
  <circle cx="432" cy="432" r="6" fill="#00d4ff" opacity="0.6"/>
</svg>
